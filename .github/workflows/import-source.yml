name: Import source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source zip
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/source.zip \
            "https://aka.doubaocdn.com/s/AkM3DHjk8W"
          unzip -q /tmp/source.zip -d /tmp/source

      - name: Replace repository files
        run: |
          rm -rf website apps
          rm -f README.md GITHUB.md .gitignore
          cp -R /tmp/source/website ./website
          cp -R /tmp/source/apps ./apps
          cp /tmp/source/README.md ./README.md
          cp /tmp/source/GITHUB.md ./GITHUB.md
          cp /tmp/source/.gitignore ./.gitignore

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import website and apps source 1.0.5"
          git push origin HEAD:main

      - name: Move v1.0.5 tag
        run: |
          git tag -f v1.0.5
          git push origin refs/tags/v1.0.5 --force
